# Servidor de JAMÓN RUN en Cloudflare Workers (plan gratuito).
name = "jamon-run"
main = "server/src/index.ts"
compatibility_date = "2025-06-01"

# El mismo Worker sirve el juego compilado (dist/) y las salas online.
[assets]
directory = "./dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

# Perfil de cada jugador: lonchas, nivel, misiones y cosméticos.
[[durable_objects.bindings]]
name = "PROFILE"
class_name = "Profile"

# En el plan gratuito los Durable Objects tienen que usar SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Matchmaker"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Profile"]

[observability]
enabled = true
