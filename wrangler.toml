# Servidor de JAMONGUS en Cloudflare Workers (plan gratuito).
name = "jamongus"
main = "server/src/index.ts"
compatibility_date = "2025-06-01"

# El mismo Worker sirve el juego compilado (dist/) y las salas online.
[assets]
directory = "./dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

# Perfil de cada jugador: lonchas, nivel, misiones y cosméticos.
[[durable_objects.bindings]]
name = "PROFILE"
class_name = "Profile"

# El Worker antiguo (jamon-run): de ahí se traen los perfiles la primera vez.
[[services]]
binding = "LEGACY"
service = "jamon-run"

# En el plan gratuito los Durable Objects tienen que usar SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Matchmaker"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Profile"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
# URL antigua (jamon-run): redirige a la nueva y guarda los perfiles de antes.
# Se despliega con:  npx wrangler deploy --env legacy
[env.legacy]
name = "jamon-run"
# No se enlaza a sí mismo.
services = []

# El Worker va primero: así todo redirige (no se sirve el juego viejo).
[env.legacy.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[env.legacy.vars]
REDIRECT_TO = "https://jamongus.jamon-run.workers.dev"

[[env.legacy.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[env.legacy.durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[env.legacy.durable_objects.bindings]]
name = "PROFILE"
class_name = "Profile"
